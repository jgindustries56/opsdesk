            '<span class="sev ' + it.sev + '"></span>' +
            '<div class="text">' + esc(it.text) + '<div class="sub">' + esc(it.sub) + "</div></div>" +
            (it.amt ? '<div class="amt tab" style="' + (it.amtCritical ? "color:var(--critical-text)" : "") + '">' + it.amt + "</div>" : "") +
            '<button class="btn btn-ghost btn-sm" data-action="schedule-item" data-kind="' + it.action + '" data-id="' + it.id + '" title="Decide when you will do this">When?</button>' +
            '<button class="btn btn-ghost btn-sm" data-action="' + it.action + '" data-id="' + it.id + '">' + it.label + "</button>" +
          "</div>").join("") + "</div>"
      : '<div class="cleared-hero">' +
          '<div class="cleared-mark">&#10003;</div>' +
          "<h3>Queue cleared</h3>" +
          "<p>Every invoice is current, every call has been returned, and no estimate is sitting unanswered. Nothing on this screen needs you.</p>" +
          '<div class="cleared-tally">' +
            '<div class="ct"><div class="v tab">' + prog.done + '</div><div class="l">Items cleared</div></div>' +
            '<div class="ct"><div class="v tab" style="color:var(--good-text)">' + money(state.recovered) + '</div><div class="l">Chased today</div></div>' +
            '<div class="ct"><div class="v tab">' + state.scheduled.length + '</div><div class="l">Scheduled ahead</div></div>' +
          "</div>" +
        "</div>";

    return '' +
    '<div class="page-head"><h1>Overview</h1><p>Everything that happened, and the three things that need you today.</p></div>' +

    '<div class="landmark"><span class="lm-ico">' + lm.ico + '</span><div class="lm-text">' + lm.text + "</div>" +
      (state.scheduled.length ? '<button class="btn btn-ghost btn-sm" data-action="nav" data-page="inbox">' + state.scheduled.length + " scheduled</button>" : "") +
    "</div>" +

    '<div class="attention' + (items.length ? "" : " clear") + '">' +
      '<div class="attention-head" style="justify-content:space-between;">' +
        '<div style="display:flex;align-items:center;gap:8px;">' +
          '<span class="sev ' + (items.length ? "critical" : "") + '" style="' + (items.length ? "" : "background:var(--good)") + '"></span>' +
          "<h2>" + (items.length ? "Needs attention today" : "All clear \u2014 nothing needs you right now") + "</h2>" +
          (items.length ? '<span class="count">\u2014 ' + items.length + " item" + (items.length > 1 ? "s" : "") + "</span>" : "") +
        "</div>" + ring +
      "</div>" + attentionInner +
    "</div>" +

    (state.scheduled.length ?
      '<div class="panel" style="margin-bottom:22px;">' +
        '<div class="panel-head"><h2>Scheduled follow-ups <span class="sub">\u2014 decided in advance</span></h2>' +
        '<span class="sub">' + state.scheduled.length + " committed</span></div>" +
        "<div>" + state.scheduled.map(s =>
          '<div class="sched-item">' +
            '<span class="sched-when">' + esc(s.trigger) + "</span>" +
            '<div class="sched-body"><div class="st">' + esc(s.label) + '</div><div class="sd">' + esc(s.detail) + "</div></div>" +
            '<button class="btn btn-ghost btn-sm" data-action="do-scheduled" data-id="' + s.id + '">Do it now</button>' +
            '<button class="btn btn-ghost btn-sm" data-action="drop-scheduled" data-id="' + s.id + '">Drop</button>' +
          "</div>").join("") + "</div>" +
      "</div>" : "") +

    '<div class="kpi-row">' +
      kpi("Revenue, month to date", money(collectedMTD()), "&#8593; 12%", "good", "0,24 33,20 66,18 100,12 133,10 166,6 200,2", "var(--good)", "vs. " + money(state.revenue[4].collected) + " in July", "goto-payments") +
      kpi("Open balance (AR)", money(out), od.length + " overdue", od.length ? "bad" : "neutral", "0,10 33,14 66,12 100,18 133,16 166,22 200,20", "var(--critical)", "US small-biz average: " + money(BENCH.avgOwed), "goto-payments") +
      kpi("Unreturned contacts", String(missedNoCallback().length + state.messages.filter(m => m.unread).length), missedNoCallback().length ? "action needed" : "clear", missedNoCallback().length ? "bad" : "good", "0,22 33,18 66,20 100,14 133,10 166,12 200,4", "var(--seq-500)", "Missed calls + unread messages", "goto-inbox") +
      kpi("Avg. response time", "9 min", "&#8595; 13 min", "good", "0,4 33,8 66,10 100,14 133,18 166,22 200,24", "var(--good)", "Faster replies win more of these jobs", "explain-response") +
    "</div>" +

    '<div class="content-grid">' +
      '<div class="panel">' +
        '<div class="panel-head"><h2>Inbox <span class="sub">\u2014 calls, texts &amp; email</span></h2>' +
        '<button class="link-btn" data-action="nav" data-page="inbox">View all</button></div>' +
        '<div>' + state.messages.slice(0, 6).map(inboxRow).join("") + "</div>" +
      "</div>" +

      '<div class="stack">' +
        '<div class="panel">' +
          '<div class="panel-head"><h2>Quick capture</h2><span class="sub"><span class="kbd">N</span></span></div>' +
          '<div class="panel-pad">' + captureForm("qc") + "</div>" +
        "</div>" +

        '<div class="panel">' +
          '<div class="panel-head"><h2>Billed vs. collected</h2><span class="sub">6 months</span></div>' +
          '<div class="chart-wrap">' +
            '<div class="chart-legend">' +
              '<div class="lg"><span class="sw" style="background:var(--seq-300);opacity:0.45;"></span>Billed</div>' +
              '<div class="lg"><span class="sw" style="background:var(--seq-500);"></span>Collected</div>' +
            "</div>" +
            '<div class="bars">' + state.revenue.map(r =>
              '<div class="bar-group">' +
                '<div class="bar-stack" data-action="explain-month" data-month="' + r.m + '" title="' + r.m + ': billed ' + money(r.billed) + ', collected ' + money(r.collected) + '">' +
                  '<div class="bar-billed" style="height:' + (r.billed / maxBar * 100) + '%"></div>' +
                  '<div class="bar-collected" style="height:' + (r.collected / maxBar * 100) + '%"></div>' +
                "</div>" +
                '<div class="bar-month">' + r.m + "</div>" +
              "</div>").join("") + "</div>" +
          "</div>" +
        "</div>" +

        '<div class="panel">' +
          '<div class="panel-head"><h2>Outstanding invoices</h2>' +
          '<button class="link-btn" data-action="nav" data-page="payments">Manage</button></div>' +
          '<div>' + state.invoices.filter(i => i.status !== "paid").slice(0, 4).map(invMiniRow).join("") + "</div>" +
        "</div>" +
      "</div>" +
    "</div>";
  }

  function kpi(label, value, delta, tone, points, stroke, foot, action) {
    return '<button class="kpi-card" data-action="' + action + '">' +
      '<div class="kpi-label">' + label + "</div>" +
      '<div class="kpi-value-row"><div class="kpi-value tab">' + value + "</div>" +
      '<div class="kpi-delta ' + tone + '">' + delta + "</div></div>" +
      '<svg class="spark" viewBox="0 0 200 30" preserveAspectRatio="none" aria-hidden="true">' +
        '<polyline points="' + points + '" fill="none" stroke="' + stroke + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
      '<div class="kpi-foot">' + foot + "</div>" +
    "</button>";
  }

  function inboxRow(m) {
    return '<div class="inbox-item' + (m.unread ? " unread" : "") + '">' +
      '<div class="chan-ico ' + m.chan + '">' + CHAN_ICO[m.chan] + "</div>" +
      '<div class="inbox-main">' +
        '<div class="inbox-top"><span class="inbox-name">' + esc(m.who) + '</span><span class="inbox-time">' + esc(m.when) + "</span></div>" +
        '<div class="inbox-snippet">' + esc(m.snippet) + "</div>" +
        '<div class="inbox-bottom">' +
          '<span class="pill ' + m.status + '">' + m.status.toUpperCase() + "</span>" +
          (m.status === "missed" ? '<button class="btn btn-ghost btn-sm" data-action="call-back" data-id="' + m.id + '">Call back</button>' : "") +
          (m.status === "new" ? '<button class="btn btn-ghost btn-sm" data-action="reply" data-id="' + m.id + '">Reply</button>' : "") +
          (m.status === "waiting" ? '<button class="btn btn-ghost btn-sm" data-action="reply" data-id="' + m.id + '">Follow up</button>' : "") +
          (m.status !== "done" ? '<button class="btn btn-ghost btn-sm" data-action="mark-done" data-id="' + m.id + '">Mark done</button>' : "") +
        "</div>" +
      "</div>" +
    "</div>";
  }

  function invMiniRow(i) {
    const pillMap = { overdue: "missed", sent: "waiting", draft: "draft", paid: "done" };
    const lbl = i.status === "overdue" ? "OVERDUE " + i.days + "D" : i.status === "sent" ? "SENT " + i.days + "D" : i.status.toUpperCase();
    return '<div class="inbox-item" style="align-items:center;">' +
      '<div class="inbox-main" style="display:flex;align-items:center;justify-content:space-between;gap:10px;">' +
        '<div><div style="font-weight:600;font-size:13px;">' + esc(i.who) + '</div><div class="sub" style="color:var(--ink-muted);font-size:11.5px;">#' + i.num + "</div></div>" +
        '<span class="pill ' + pillMap[i.status] + '">' + lbl + "</span>" +
        '<div class="tab" style="font-weight:600;">' + money(i.amount) + "</div>" +
      "</div>" +
    "</div>";
  }

  function captureForm(prefix) {
    return '<div class="field" id="' + prefix + '-nameF"><label for="' + prefix + '-name">Contact name</label>' +
      '<input type="text" id="' + prefix + '-name" placeholder="e.g. Maria Alvarez">' +
      '<div class="field-err">Enter a name so this can be filed against a contact.</div></div>' +
    '<div class="field-row">' +
      '<div class="field"><label for="' + prefix + '-phone">Phone</label><input type="text" id="' + prefix + '-phone" placeholder="(678) 555-0100"></div>' +
      '<div class="field"><label for="' + prefix + '-chan">Channel</label><select id="' + prefix + '-chan">' +
        '<option value="call">Call</option><option value="text">Text</option><option value="email">Email</option><option value="walkin">Walk-in</option>' +
      "</select></div>" +
    "</div>" +
    '<div class="field"><label for="' + prefix + '-note">Note</label>' +
      '<textarea id="' + prefix + '-note" placeholder="What happened, what\'s next…"></textarea></div>' +
    '<button class="btn btn-primary" style="width:100%;justify-content:center;" data-action="save-capture" data-prefix="' + prefix + '">Save to inbox</button>';
  }

  function pageInbox() {
    const f = state.inboxFilter;
    let list = state.messages.slice();
    if (f === "unread") list = list.filter(m => m.unread);
    else if (f === "missed") list = list.filter(m => m.status === "missed");
    else if (f !== "all") list = list.filter(m => m.chan === f);

    const chips = [["all", "All"], ["call", "Calls"], ["text", "Texts"], ["email", "Email"], ["walkin", "Walk-ins"], ["unread", "Unread"], ["missed", "Missed"]];

    return '<div class="page-head"><h1>Inbox</h1><p>Every inbound touch in one thread — nothing lives only in someone’s phone.</p></div>' +
      '<div class="panel">' +
        '<div class="panel-head"><h2>' + list.length + " message" + (list.length === 1 ? "" : "s") + '<span class="sub"> — ' + unreadCount() + " unread</span></h2>" +
          '<div style="display:flex;gap:8px;">' +
            '<button class="btn btn-ghost btn-sm" data-action="mark-all-read">Mark all read</button>' +
            '<button class="btn btn-primary btn-sm" data-action="open-capture">+ Log activity</button>' +
          "</div>" +
        "</div>" +
        '<div class="chip-row">' + chips.map(c =>
          '<button class="chip ' + (f === c[0] ? "active" : "") + '" data-action="inbox-filter" data-filter="' + c[0] + '">' + c[1] + "</button>").join("") + "</div>" +
        '<div style="margin-top:8px;">' +
          (list.length ? list.map(inboxRow).join("") : '<div class="empty-state">Nothing here with that filter.</div>') +
        "</div>" +
      "</div>";
  }

  function pagePayments() {
    const f = state.invoiceFilter;
    let list = state.invoices.slice();
    if (f !== "all") list = list.filter(i => i.status === f);
    const buckets = agingBuckets();
    const maxB = Math.max.apply(null, buckets.map(b => b.total).concat([1]));
    const out = outstanding();
    const paidTotal = state.invoices.filter(i => i.status === "paid").reduce((s, i) => s + i.amount, 0);
    const chips = [["all", "All"], ["overdue", "Overdue"], ["sent", "Sent"], ["draft", "Drafts"], ["paid", "Paid"]];

    return '<div class="page-head"><h1>Payments</h1><p>What’s owed, how old it is, and who to chase first.</p></div>' +

    '<div class="kpi-row" style="grid-template-columns:repeat(3,1fr);">' +
      kpi("Outstanding", money(out), overdueList().length + " overdue", overdueList().length ? "bad" : "good", "0,10 33,14 66,12 100,18 133,16 166,22 200,20", "var(--critical)", "56% of US small businesses carry unpaid invoices", "noop") +
      kpi("Collected this month", money(paidTotal), "&#8593; 8%", "good", "0,24 33,20 66,18 100,12 133,10 166,6 200,2", "var(--good)", "Across " + state.invoices.filter(i => i.status === "paid").length + " settled invoices", "noop") +
      kpi("Oldest unpaid", Math.max.apply(null, overdueList().map(i => i.days).concat([0])) + " days", "past terms", "bad", "0,6 33,9 66,12 100,14 133,17 166,20 200,24", "var(--critical)", "Industry: ~1 in 10 invoices pass 30 days", "noop") +
    "</div>" +

    '<div class="content-grid">' +
      '<div class="panel">' +
        '<div class="panel-head"><h2>Invoices</h2>' +
          '<button class="btn btn-primary btn-sm" data-action="new-invoice">+ New invoice</button></div>' +
        '<div class="chip-row">' + chips.map(c =>
          '<button class="chip ' + (f === c[0] ? "active" : "") + '" data-action="invoice-filter" data-filter="' + c[0] + '">' + c[1] + "</button>").join("") + "</div>" +
        '<div class="tbl-scroll" style="margin-top:8px;"><table class="data"><thead><tr>' +
          "<th>Customer</th><th>Status</th><th class='right'>Amount</th><th class='right'>Action</th>" +
        "</tr></thead><tbody>" +
        (list.length ? list.map(i => {
          const pillMap = { overdue: "missed", sent: "waiting", draft: "draft", paid: "done" };
          const lbl = i.status === "overdue" ? "OVERDUE " + i.days + "D" : i.status === "sent" ? "SENT " + i.days + "D" : i.status.toUpperCase();
          return "<tr>" +
            '<td><div class="who">' + esc(i.who) + '</div><div class="sub">#' + i.num + " · " + esc(i.desc) + "</div></td>" +
            '<td><span class="pill ' + pillMap[i.status] + '">' + lbl + "</span></td>" +
            '<td class="right tab" style="font-weight:600;' + (i.status === "paid" ? "color:var(--ink-muted);" : "") + '">' + money(i.amount) + "</td>" +
            '<td class="right"><div class="row-actions">' +
              (i.status === "overdue" ? '<button class="btn btn-ghost btn-sm" data-action="remind-invoice" data-id="' + i.id + '">Remind</button>' : "") +
              (i.status === "draft" ? '<button class="btn btn-ghost btn-sm" data-action="send-invoice" data-id="' + i.id + '">Send</button>' : "") +
              (i.status === "sent" ? '<button class="btn btn-ghost btn-sm" data-action="chase-estimate" data-id="' + i.id + '">Follow up</button>' : "") +
              (i.status !== "paid" ? '<button class="btn btn-primary btn-sm" data-action="mark-paid" data-id="' + i.id + '">Mark paid</button>' : '<span class="sub">Settled</span>') +
            "</div></td></tr>";
        }).join("") : '<tr><td colspan="4"><div class="empty-state">No invoices with that filter.</div></td></tr>') +
        "</tbody></table></div>" +
      "</div>" +

      '<div class="stack">' +
        '<div class="panel">' +
          '<div class="panel-head"><h2>AR aging</h2><span class="sub">days outstanding</span></div>' +
          '<div class="panel-pad"><div class="aging">' +
            buckets.map(b =>
              '<div class="aging-row">' +
                '<div class="lbl">' + b.lbl + "</div>" +
                '<div class="aging-track"><div class="aging-fill" style="width:' + (b.total / maxB * 100) + "%;background:" + b.color + ';"></div></div>' +
                '<div class="val tab">' + money(b.total) + "</div>" +
              "</div>").join("") +
          "</div>" +
          '<div class="kpi-foot" style="margin-top:12px;">Anything past 60 days collects at a materially lower rate — chase the dark bars first.</div>' +
          "</div>" +
        "</div>" +

        '<div class="panel">' +
          '<div class="panel-head"><h2>Bulk actions</h2></div>' +
          '<div class="panel-pad" style="display:grid;gap:9px;">' +
            '<button class="btn btn-ghost" style="justify-content:center;" data-action="remind-all">Send reminder to all ' + overdueList().length + " overdue</button>" +
            '<button class="btn btn-ghost" style="justify-content:center;" data-action="export-csv">Export statement (CSV)</button>' +
            '<button class="btn btn-ghost" style="justify-content:center;" data-action="new-invoice">Create invoice</button>' +
          "</div>" +
        "</div>" +
      "</div>" +
    "</div>";
  }

  function pageContacts() {
    let list = state.contacts.slice();
    if (state.contactSort === "recent") list.sort((a, b) => a.lastTs - b.lastTs);
    else if (state.contactSort === "value") list.sort((a, b) => b.ltv - a.ltv);
    else if (state.contactSort === "stale") list.sort((a, b) => b.lastTs - a.lastTs);

    const flagPill = { overdue: ["missed", "OWES"], "no-callback": ["missed", "NO CALLBACK"], stale: ["waiting", "GOING COLD"], "new": ["new", "NEW"] };
    const sorts = [["recent", "Most recent"], ["value", "Highest value"], ["stale", "Going cold"]];

    return '<div class="page-head"><h1>Contacts</h1><p>Service history is the thing owners reach for most — every job, call, and dollar per person.</p></div>' +
      '<div class="panel">' +
        '<div class="panel-head"><h2>' + list.length + ' contacts</h2>' +
          '<button class="btn btn-primary btn-sm" data-action="new-contact">+ Add contact</button></div>' +
        '<div class="chip-row">' + sorts.map(s =>
          '<button class="chip ' + (state.contactSort === s[0] ? "active" : "") + '" data-action="contact-sort" data-sort="' + s[0] + '">' + s[1] + "</button>").join("") + "</div>" +
        '<div class="tbl-scroll" style="margin-top:8px;"><table class="data"><thead><tr>' +
          "<th>Name</th><th>Vehicle / account</th><th class='right'>Lifetime</th><th>Last contact</th><th class='right'>Action</th>" +
        "</tr></thead><tbody>" +
        list.map(c => {
          const fp = c.flag ? flagPill[c.flag] : null;
          return "<tr>" +
            '<td><div class="who">' + esc(c.name) + " " + (fp ? '<span class="pill ' + fp[0] + '" style="margin-left:4px;">' + fp[1] + "</span>" : "") + "</div>" +
            '<div class="sub">' + esc(c.phone) + "</div></td>" +
            "<td>" + esc(c.vehicle) + '<div class="sub">' + c.visits + " visit" + (c.visits === 1 ? "" : "s") + "</div></td>" +
            '<td class="right tab" style="font-weight:600;">' + money(c.ltv) + "</td>" +
            "<td>" + esc(c.last) + "</td>" +
            '<td class="right"><div class="row-actions">' +
              '<button class="btn btn-ghost btn-sm" data-action="view-contact" data-id="' + c.id + '">History</button>' +
              '<button class="btn btn-primary btn-sm" data-action="log-for-contact" data-id="' + c.id + '">Log</button>' +
            "</div></td></tr>";
        }).join("") +
        "</tbody></table></div>" +
      "</div>";
  }

  function pageSettings() {
    const s = state.settings;
    const accents = ["#0f7d72", "#c4291d", "#b08d4f", "#4f6b4a", "#256abf", "#e2637a"];

    return '<div class="page-head"><h1>Settings</h1><p>The white-label layer. Everything here is per-deployment — the engine underneath never changes.</p></div>' +
      '<div class="note">Changing a threshold immediately re-evaluates the attention queue on Overview. That is the actual behaviour, not a mock — set the invoice chase to 60 days and watch two items disappear.</div>' +
      '<div class="set-grid">' +
        '<div class="stack">' +
          '<div class="panel">' +
            '<div class="panel-head"><h2>Follow-up thresholds</h2></div>' +
            thresholdRow("Stale enquiry", "No reply after this many days", "staleEnquiry", 1, 14, s.staleEnquiry, " days") +
            thresholdRow("Overdue job", "Job open longer than", "overdueJob", 12, 168, s.overdueJob, " hrs") +
            thresholdRow("Invoice chase", "Chase unpaid invoices after", "invoiceChase", 7, 90, s.invoiceChase, " days") +
            thresholdRow("Reconnect", "Nudge quiet customers after", "reconnect", 30, 540, s.reconnect, " days") +
          "</div>" +

          '<div class="panel">' +
            '<div class="panel-head"><h2>Notifications</h2></div>' +
            toggleRow("Missed call alerts", "Push the moment a call goes unanswered", "notifyMissedCall", s.notifyMissedCall) +
            toggleRow("Overdue invoice alerts", "Daily nudge while anything is past terms", "notifyOverdue", s.notifyOverdue) +
            toggleRow("Daily digest email", "One 7am summary instead of live pings", "notifyDailyDigest", s.notifyDailyDigest) +
            toggleRow("SMS to owner", "Text the owner, not just the dashboard", "notifySms", s.notifySms) +
            toggleRow("Auto-send reminders", "Chase overdue invoices without asking", "autoRemind", s.autoRemind) +
          "</div>" +
        "</div>" +

        '<div class="stack">' +
          '<div class="panel">' +
            '<div class="panel-head"><h2>Branding &amp; vocabulary</h2></div>' +
            '<div class="panel-pad">' +
              '<div class="field"><label>Accent colour</label><div class="swatch-row">' +
                accents.map(a => '<button class="swatch ' + (s.accent === a ? "sel" : "") + '" style="background:' + a + '" data-action="set-accent" data-color="' + a + '" aria-label="Accent ' + a + '"></button>').join("") +
              "</div></div>" +
              '<div class="field-row">' +
                '<div class="field"><label for="vocabJob">"Job" is called</label><input type="text" id="vocabJob" value="' + esc(s.vocabJob) + '" data-action="vocab" data-key="vocabJob"></div>' +
                '<div class="field"><label for="vocabIntake">"Intake" is called</label><input type="text" id="vocabIntake" value="' + esc(s.vocabIntake) + '" data-action="vocab" data-key="vocabIntake"></div>' +
              "</div>" +
              '<div class="field"><label for="currency">Currency</label><select id="currency" data-action="vocab" data-key="currency">' +
                ["USD ($)", "GBP (£)", "EUR (€)", "CAD ($)"].map(c => '<option' + (s.currency === c ? " selected" : "") + ">" + c + "</option>").join("") +
              "</select></div>" +
              '<button class="btn btn-primary" style="width:100%;justify-content:center;" data-action="save-branding">Save branding</button>' +
            "</div>" +
          "</div>" +

          '<div class="panel">' +
            '<div class="panel-head"><h2>Modules</h2><span class="sub">turn off what this client doesn’t use</span></div>' +
            toggleRow("Contacts", "Customer records & history", "modContacts", s.modContacts) +
            toggleRow("Invoices", "Billing & line items", "modInvoices", s.modInvoices) +
            toggleRow("Jobs", "Work in progress tracking", "modJobs", s.modJobs) +
            toggleRow("Payments", "Recording & reconciliation", "modPayments", s.modPayments) +
          "</div>" +

          '<div class="panel">' +
            '<div class="panel-head"><h2>Danger zone</h2></div>' +
            '<div class="panel-pad" style="display:grid;gap:9px;">' +
              '<button class="btn btn-ghost" style="justify-content:center;" data-action="reset-demo">Reset demo data</button>' +
              '<button class="btn btn-danger" style="justify-content:center;" data-action="wipe-tenant">Delete this deployment</button>' +
            "</div>" +
          "</div>" +
        "</div>" +
      "</div>";
  }

  function thresholdRow(title, desc, key, min, max, val, unit) {
    return '<div class="set-row"><div class="info"><div class="t">' + title + '</div><div class="d">' + desc + "</div></div>" +
      '<div class="thresh"><input type="range" min="' + min + '" max="' + max + '" value="' + val + '" data-action="threshold" data-key="' + key + '" aria-label="' + title + '">' +
      '<span class="v tab" id="v-' + key + '">' + val + unit + "</span></div></div>";
  }

  function toggleRow(title, desc, key, on) {
    return '<div class="set-row"><div class="info"><div class="t">' + title + '</div><div class="d">' + desc + "</div></div>" +
      '<button class="toggle ' + (on ? "on" : "") + '" data-action="toggle" data-key="' + key + '" role="switch" aria-checked="' + on + '" aria-label="' + title + '"></button></div>';
  }

  // ============ render ============
  function render() {
    renderNav();
    $("#tenantName").textContent = state.tenant;
    $("#userTenant").textContent = state.tenant;
    $("#userInitials").textContent = initials(state.tenant);
    document.documentElement.style.setProperty("--brand", state.settings.accent);
    const map = { overview: pageOverview, inbox: pageInbox, payments: pagePayments, contacts: pageContacts, settings: pageSettings };
    $("#view").innerHTML = (map[state.page] || pageOverview)();
    window.scrollTo(0, 0);
  }

  // ============ modal ============
  function openModal(title, bodyHTML, footHTML, wide) {
    $("#modalRoot").innerHTML =
      '<div class="overlay" data-action="close-modal-bg"><div class="modal' + (wide ? " wide" : "") + '" role="dialog" aria-modal="true">' +
        '<div class="modal-head"><h3>' + title + '</h3><button class="modal-close" data-action="close-modal" aria-label="Close">&times;</button></div>' +
        '<div class="modal-body">' + bodyHTML + "</div>" +
        (footHTML ? '<div class="modal-foot">' + footHTML + "</div>" : "") +
      "</div></div>";
  }
  function closeModal() { $("#modalRoot").innerHTML = ""; }

  // ============ actions ============
  const actions = {
    nav(el) { state.page = el.dataset.page; state.selectedContact = null; render(); },
    noop() {},

    range(el) {
      state.range = +el.dataset.range;
      document.querySelectorAll("#rangeSeg button").forEach(b => b.classList.toggle("active", b === el));
      toast("Range set to " + state.range + " days", "Figures and charts refreshed.", "info");
    },

    "goto-payments"() { state.page = "payments"; render(); },
    "goto-inbox"() { state.page = "inbox"; render(); },
    "goto-inbox-missed"() { state.page = "inbox"; state.inboxFilter = "missed"; render(); },

    "explain-response"() {
      openModal("Why response time is on this screen",
        "<p style='margin-top:0;font-size:13px;line-height:1.6;'>One wasted hour a day works out to roughly <strong>260 hours a year</strong>. At a $150/hr billable rate that is about <strong>$39,000</strong> of revenue that never gets booked — most of it lost in the gap between a customer calling and someone calling back.</p>" +
        "<p style='font-size:13px;line-height:1.6;'>That is why unreturned contacts sit in the attention queue above the revenue number, rather than buried in a report.</p>" +
        "<p style='font-size:11.5px;color:var(--ink-muted);'>Benchmark from the 2026 state-of-small-field-service report.</p>",
        '<button class="btn btn-primary" data-action="close-modal">Got it</button>');
    },

    "explain-month"(el) {
      const r = state.revenue.find(x => x.m === el.dataset.month);
      if (!r) return;
      const gap = r.billed - r.collected;
      openModal(r.m + " — billed vs. collected",
        "<div class='cd-stats'>" +
          "<div class='cd-stat'><div class='l'>Billed</div><div class='v tab'>" + money(r.billed) + "</div></div>" +
          "<div class='cd-stat'><div class='l'>Collected</div><div class='v tab'>" + money(r.collected) + "</div></div>" +
          "<div class='cd-stat'><div class='l'>Gap</div><div class='v tab' style='color:var(--critical-text)'>" + money(gap) + "</div></div>" +
        "</div>" +
        "<p style='font-size:13px;margin-bottom:0;'>" + money(gap) + " was invoiced in " + r.m + " and never landed. That gap is what the AR aging panel on Payments is tracking.</p>",
        '<button class="btn btn-ghost" data-action="close-modal">Close</button>' +
        '<button class="btn btn-primary" data-action="goto-payments-close">Open Payments</button>');
    },
    "goto-payments-close"() { closeModal(); state.page = "payments"; render(); },

    // ---- inbox ----
    "inbox-filter"(el) { state.inboxFilter = el.dataset.filter; render(); },
    "mark-all-read"() {
      const n = unreadCount();
      state.messages.forEach(m => { m.unread = false; });
      render();
      toast(n ? n + " marked read" : "Already all read", n ? "Inbox badge cleared." : "", n ? null : "info");
    },
    "mark-done"(el) {
      const m = state.messages.find(x => x.id === +el.dataset.id);
      if (!m) return;
      m.status = "done"; m.unread = false;
      render();
      toast("Marked done", m.who + " — cleared from the queue.");
    },
    "call-back"(el) {
      const m = state.messages.find(x => x.id === +el.dataset.id);
      if (!m) return;
      openModal("Log a callback — " + esc(m.who),
        "<p style='margin-top:0;font-size:13px;color:var(--ink-secondary);'>Calling " + esc(m.phone) + ". Log the outcome so it leaves the attention queue.</p>" +
        '<div class="field"><label for="cb-outcome">Outcome</label><select id="cb-outcome">' +
          "<option>Reached — booked them in</option><option>Reached — quoted, will decide</option><option>No answer, left voicemail</option><option>Wrong number</option>" +
        "</select></div>" +
        '<div class="field"><label for="cb-note">Note</label><textarea id="cb-note" placeholder="Optional detail…"></textarea></div>',
        '<button class="btn btn-ghost" data-action="close-modal">Cancel</button>' +
        '<button class="btn btn-primary" data-action="confirm-callback" data-id="' + m.id + '">Log callback</button>');
    },
    "confirm-callback"(el) {
      const m = state.messages.find(x => x.id === +el.dataset.id);
      const outcome = $("#cb-outcome") ? $("#cb-outcome").value : "Logged";
      if (m) {
        m.status = "done"; m.unread = false;
        m.snippet = "Callback logged — " + outcome;
        m.when = "just now"; m.ts = 0;
        recordCleared(0);
      }
      closeModal(); render();
      toast("Callback logged", (m ? m.who : "Contact") + " — " + outcome);
    },
    reply(el) {
      const m = state.messages.find(x => x.id === +el.dataset.id);
      if (!m) return;
      const templ = m.chan === "email"
        ? "Hi " + m.who.split(" ").slice(-1)[0] + ",\n\nThanks for reaching out — resending that now. Let me know if anything looks off.\n\nRedline Auto Works"
        : "Hi " + m.who.split(" ").slice(-1)[0] + " — yes, today works. Bring it by any time before 5 and we'll take a look.";
      openModal("Reply to " + esc(m.who) + " · " + CHAN_LBL[m.chan],
        "<div style='background:var(--page);border:1px solid var(--border);border-radius:8px;padding:11px 13px;font-size:12.5px;color:var(--ink-secondary);margin-bottom:13px;'>" + esc(m.snippet) + "</div>" +
        '<div class="field"><label for="rp-body">Your reply</label><textarea id="rp-body" style="min-height:110px;">' + esc(templ) + "</textarea></div>" +
        "<div style='font-size:11.5px;color:var(--ink-muted);'>Pre-filled from your saved template — edit before sending.</div>",
        '<button class="btn btn-ghost" data-action="close-modal">Cancel</button>' +
        '<button class="btn btn-primary" data-action="confirm-reply" data-id="' + m.id + '">Send ' + CHAN_LBL[m.chan].toLowerCase() + "</button>", true);
    },
    "confirm-reply"(el) {
      const m = state.messages.find(x => x.id === +el.dataset.id);
      const body = $("#rp-body") ? $("#rp-body").value.trim() : "";
      if (!body) { toast("Nothing to send", "Write something first.", "err"); return; }
      if (m) { m.status = "done"; m.unread = false; m.snippet = "You replied: " + body.split("\n")[0].slice(0, 60); m.when = "just now"; m.ts = 0; }
      closeModal(); render();
      toast("Reply sent", (m ? m.who : "") + " — thread closed.");
    },

    // ---- capture ----
    "open-capture"() {
      openModal("Log activity", captureForm("md"),
        '<button class="btn btn-ghost" data-action="close-modal">Cancel</button>', false);
    },
    "save-capture"(el) {
      const p = el.dataset.prefix;
      const nameEl = $("#" + p + "-name");
      const name = nameEl ? nameEl.value.trim() : "";
      const fieldWrap = $("#" + p + "-nameF");
      if (!name) {
        if (fieldWrap) fieldWrap.classList.add("invalid");
        if (nameEl) nameEl.focus();
        toast("Name required", "Every logged activity files against a contact.", "err");
        return;
      }
      if (fieldWrap) fieldWrap.classList.remove("invalid");
      const chan = $("#" + p + "-chan") ? $("#" + p + "-chan").value : "call";
      const phone = $("#" + p + "-phone") ? $("#" + p + "-phone").value.trim() : "";
      const note = $("#" + p + "-note") ? $("#" + p + "-note").value.trim() : "";

      state.messages.unshift({
        id: nid(), chan: chan, who: name, phone: phone || "—",
        snippet: note || CHAN_LBL[chan] + " logged manually",
        when: "just now", ts: 0, status: "new", unread: true
      });
      if (!state.contacts.some(c => c.name.toLowerCase() === name.toLowerCase())) {
        state.contacts.unshift({
          id: nid(), name: name, phone: phone || "—", email: "—",
          vehicle: "Not recorded", ltv: 0, visits: 0, last: "just now", lastTs: 0, flag: "new"
        });
      }
      closeModal(); render();
      toast("Logged to inbox", name + " · " + CHAN_LBL[chan] + (note ? " — note saved" : ""));
    },

    // ---- invoices ----
    "invoice-filter"(el) { state.invoiceFilter = el.dataset.filter; render(); },
    "remind-invoice"(el) {
      const inv = state.invoices.find(x => x.id === +el.dataset.id);
      if (!inv) return;
      const tone = inv.days > 60 ? "firm" : "gentle";
      openModal("Payment reminder — #" + inv.num,
        "<p style='margin-top:0;font-size:13px;color:var(--ink-secondary);'>" + esc(inv.who) + " · " + money(inv.amount) + " · <strong>" + inv.days + " days overdue</strong></p>" +
        '<div class="field"><label for="rm-tone">Tone</label><select id="rm-tone">' +
          '<option value="gentle"' + (tone === "gentle" ? " selected" : "") + ">Gentle — good payer, first nudge</option>" +
          '<option value="firm"' + (tone === "firm" ? " selected" : "") + ">Firm — repeat late, past 60 days</option>" +
          '<option value="final">Final notice — before collections</option>' +
        "</select></div>" +
        '<div class="field"><label for="rm-body">Message</label><textarea id="rm-body" style="min-height:100px;">Hi ' + esc(inv.who.split(" ").slice(-1)[0]) +
          ", quick note that invoice #" + inv.num + " for " + money(inv.amount) + " is now " + inv.days + " days past due. Happy to take payment over the phone if that's easier.</textarea></div>" +
        "<div style='font-size:11.5px;color:var(--ink-muted);'>Tone auto-selected from this customer's payment history.</div>",
        '<button class="btn btn-ghost" data-action="close-modal">Cancel</button>' +
        '<button class="btn btn-primary" data-action="confirm-remind" data-id="' + inv.id + '">Send reminder</button>', true);
    },
    "confirm-remind"(el) {
      const inv = state.invoices.find(x => x.id === +el.dataset.id);
      if (inv) { inv.status = "sent"; inv.days = 0; recordCleared(inv.amount); }
      closeModal(); render();
      toast("Reminder sent", inv ? inv.who + " — #" + inv.num + " moved to awaiting payment." : "");
    },
    "chase-estimate"(el) {
      const inv = state.invoices.find(x => x.id === +el.dataset.id);
      if (!inv) return;
      inv.days = 0; recordCleared(inv.amount);
      render();
      toast("Follow-up sent", inv.who + " — estimate #" + inv.num + " nudged.");
    },
    "send-invoice"(el) {
      const inv = state.invoices.find(x => x.id === +el.dataset.id);
      if (!inv) return;
      inv.status = "sent"; inv.days = 0; inv.issued = "today";
      render();
      toast("Invoice sent", "#" + inv.num + " · " + money(inv.amount) + " to " + inv.who);
    },
    "mark-paid"(el) {
      const inv = state.invoices.find(x => x.id === +el.dataset.id);
      if (!inv) return;
      openModal("Record payment — #" + inv.num,
        "<p style='margin-top:0;font-size:13px;color:var(--ink-secondary);'>" + esc(inv.who) + " · " + esc(inv.desc) + "</p>" +
        '<div class="field-row">' +
          '<div class="field"><label for="pay-amt">Amount</label><input type="text" id="pay-amt" value="' + money(inv.amount) + '"></div>' +
          '<div class="field"><label for="pay-method">Method</label><select id="pay-method"><option>Card</option><option>Cash</option><option>Check</option><option>Bank transfer</option></select></div>' +
        "</div>",
        '<button class="btn btn-ghost" data-action="close-modal">Cancel</button>' +
        '<button class="btn btn-primary" data-action="confirm-paid" data-id="' + inv.id + '">Record payment</button>');
    },
    "confirm-paid"(el) {
      const inv = state.invoices.find(x => x.id === +el.dataset.id);
      const method = $("#pay-method") ? $("#pay-method").value : "Card";
      if (inv) {
        inv.status = "paid"; inv.days = 0;
        const c = state.contacts.find(c => c.name === inv.who);
        if (c) { c.ltv += inv.amount; c.visits += 1; if (c.flag === "overdue") c.flag = null; }
      }
      closeModal(); render();
      toast("Payment recorded", inv ? money(inv.amount) + " from " + inv.who + " · " + method : "");
    },
    "remind-all"() {
      const od = overdueList();
      if (!od.length) { toast("Nothing overdue", "Every invoice is current.", "info"); return; }
      openModal("Send " + od.length + " reminders",
        "<p style='margin-top:0;font-size:13px;'>This will send a payment reminder to each of these, tone matched to their history:</p>" +
        "<div style='display:grid;gap:7px;'>" + od.map(i =>
          "<div style='display:flex;justify-content:space-between;background:var(--page);border:1px solid var(--border);border-radius:7px;padding:9px 12px;font-size:12.5px;'>" +
          "<span>" + esc(i.who) + " · #" + i.num + "</span><span class='tab' style='font-weight:600;'>" + money(i.amount) + " · " + i.days + "d</span></div>").join("") + "</div>",
        '<button class="btn btn-ghost" data-action="close-modal">Cancel</button>' +
        '<button class="btn btn-primary" data-action="confirm-remind-all">Send all ' + od.length + "</button>", true);
    },
    "confirm-remind-all"() {
      const od = overdueList();
      const total = od.reduce((s, i) => s + i.amount, 0);
      od.forEach(i => { i.status = "sent"; i.days = 0; recordCleared(i.amount); });
      closeModal(); render();
      toast(od.length + " reminders sent", money(total) + " now chased.");
    },
    "export-csv"() {
      const rows = [["Invoice", "Customer", "Description", "Amount", "Status", "Days"]]
        .concat(state.invoices.map(i => [i.num, i.who, i.desc, i.amount, i.status, i.days]));
      const csv = rows.map(r => r.map(c => '"' + String(c).replace(/"/g, '""') + '"').join(",")).join("\n");
      openModal("Statement export",
        "<p style='margin-top:0;font-size:13px;color:var(--ink-secondary);'>" + state.invoices.length + " invoices, " + money(outstanding()) + " outstanding. Preview:</p>" +
        "<pre style='background:var(--page);border:1px solid var(--border);border-radius:8px;padding:12px;font-size:11px;overflow-x:auto;max-height:240px;margin:0;'>" + esc(csv) + "</pre>",
        '<button class="btn btn-primary" data-action="close-modal">Done</button>', true);
      toast("Statement generated", state.invoices.length + " rows ready.", "info");
    },
    "new-invoice"() {
      openModal("New invoice",
        '<div class="field" id="ni-whoF"><label for="ni-who">Customer</label><select id="ni-who">' +
          state.contacts.map(c => "<option>" + esc(c.name) + "</option>").join("") + "</select></div>" +
        '<div class="field"><label for="ni-desc">Description</label><input type="text" id="ni-desc" placeholder="e.g. Brake pads & rotors, rear axle"></div>' +
        '<div class="field" id="ni-amtF"><label for="ni-amt">Amount</label><input type="text" id="ni-amt" placeholder="340">' +
        '<div class="field-err">Enter a number greater than zero.</div></div>',
        '<button class="btn btn-ghost" data-action="close-modal">Cancel</button>' +
        '<button class="btn btn-ghost" data-action="create-invoice" data-mode="draft">Save draft</button>' +
        '<button class="btn btn-primary" data-action="create-invoice" data-mode="send">Create &amp; send</button>');
    },
    "create-invoice"(el) {
      const who = $("#ni-who") ? $("#ni-who").value : "";
      const desc = $("#ni-desc") ? $("#ni-desc").value.trim() : "";
      const raw = $("#ni-amt") ? $("#ni-amt").value.replace(/[^0-9.]/g, "") : "";
      const amt = parseFloat(raw);
      if (!amt || amt <= 0) {
        const f = $("#ni-amtF"); if (f) f.classList.add("invalid");
        toast("Amount required", "An invoice needs a number on it.", "err");
        return;
      }
      const mode = el.dataset.mode;
      const num = String(1056 + state.invoices.filter(i => +i.num >= 1056).length);
      state.invoices.unshift({
        id: nid(), num: num, who: who, desc: desc || "Service", amount: Math.round(amt),
        status: mode === "send" ? "sent" : "draft", days: 0, issued: mode === "send" ? "today" : "—"
      });
      closeModal(); render();
      toast(mode === "send" ? "Invoice sent" : "Draft saved", "#" + num + " · " + money(Math.round(amt)) + " · " + who);
    },

    // ---- contacts ----
    "contact-sort"(el) { state.contactSort = el.dataset.sort; render(); },
    "view-contact"(el) {
      const c = state.contacts.find(x => x.id === +el.dataset.id);
      if (!c) return;
      const theirs = state.invoices.filter(i => i.who === c.name);
      const msgs = state.messages.filter(m => m.who === c.name);
      const owed = theirs.filter(i => i.status !== "paid" && i.status !== "draft").reduce((s, i) => s + i.amount, 0);
      openModal(esc(c.name),
        '<div class="contact-detail">' +
          '<div class="cd-head"><div class="cd-avatar">' + initials(c.name) + "</div>" +
            "<div><div style='font-weight:700;font-size:15px;'>" + esc(c.name) + "</div>" +
            "<div style='font-size:12.5px;color:var(--ink-muted);'>" + esc(c.phone) + " · " + esc(c.email) + "</div>" +
            "<div style='font-size:12.5px;color:var(--ink-secondary);'>" + esc(c.vehicle) + "</div></div></div>" +
          '<div class="cd-stats">' +
            "<div class='cd-stat'><div class='l'>Lifetime</div><div class='v tab'>" + money(c.ltv) + "</div></div>" +
            "<div class='cd-stat'><div class='l'>Visits</div><div class='v tab'>" + c.visits + "</div></div>" +
            "<div class='cd-stat'><div class='l'>Owes now</div><div class='v tab' style='" + (owed ? "color:var(--critical-text)" : "") + "'>" + money(owed) + "</div></div>" +
          "</div>" +
          "<div><div style='font-size:11px;font-weight:700;color:var(--ink-muted);letter-spacing:0.04em;text-transform:uppercase;margin-bottom:6px;'>Service history</div>" +
          '<div class="timeline">' +
            (theirs.length || msgs.length
              ? msgs.concat([]).map(m => '<div class="tl-item"><span class="tl-dot"></span><div>' + esc(m.snippet) + '<div class="when">' + CHAN_LBL[m.chan] + " · " + esc(m.when) + "</div></div></div>").join("") +
                theirs.map(i => '<div class="tl-item"><span class="tl-dot" style="background:var(--seq-500)"></span><div>' + esc(i.desc) + " — " + money(i.amount) +
                  '<div class="when">Invoice #' + i.num + " · " + i.status + " · " + esc(i.issued) + "</div></div></div>").join("")
              : '<div class="empty-state">No history recorded yet.</div>') +
          "</div></div>" +
        "</div>",
        '<button class="btn btn-ghost" data-action="close-modal">Close</button>' +
        '<button class="btn btn-primary" data-action="log-for-contact" data-id="' + c.id + '">Log activity</button>', true);
    },
    "log-for-contact"(el) {
      const c = state.contacts.find(x => x.id === +el.dataset.id);
      closeModal();
      openModal("Log activity — " + (c ? esc(c.name) : ""), captureForm("md"),
        '<button class="btn btn-ghost" data-action="close-modal">Cancel</button>');
      if (c) {
        const n = $("#md-name"); if (n) n.value = c.name;
        const p = $("#md-phone"); if (p) p.value = c.phone;
      }
    },
    "new-contact"() {
      openModal("Add contact",
        '<div class="field" id="nc-nameF"><label for="nc-name">Name</label><input type="text" id="nc-name" placeholder="e.g. Sam Barrett">' +
        '<div class="field-err">A contact needs a name.</div></div>' +
        '<div class="field-row">' +
          '<div class="field"><label for="nc-phone">Phone</label><input type="text" id="nc-phone" placeholder="(678) 555-0100"></div>' +
          '<div class="field"><label for="nc-email">Email</label><input type="text" id="nc-email" placeholder="name@example.com"></div>' +
        "</div>" +
        '<div class="field"><label for="nc-vehicle">Vehicle / account</label><input type="text" id="nc-vehicle" placeholder="2019 Honda Civic"></div>',
        '<button class="btn btn-ghost" data-action="close-modal">Cancel</button>' +
        '<button class="btn btn-primary" data-action="create-contact">Add contact</button>');
    },
    "create-contact"() {
      const name = $("#nc-name") ? $("#nc-name").value.trim() : "";
      if (!name) {
        const f = $("#nc-nameF"); if (f) f.classList.add("invalid");
        toast("Name required", "", "err"); return;
      }
      state.contacts.unshift({
        id: nid(), name: name,
        phone: ($("#nc-phone") && $("#nc-phone").value.trim()) || "—",
        email: ($("#nc-email") && $("#nc-email").value.trim()) || "—",
        vehicle: ($("#nc-vehicle") && $("#nc-vehicle").value.trim()) || "Not recorded",
        ltv: 0, visits: 0, last: "just now", lastTs: 0, flag: "new"
      });
      closeModal(); render();
      toast("Contact added", name + " is now in your list.");
    },

    // ---- settings ----
    threshold(el) {
      const key = el.dataset.key;
      state.settings[key] = +el.value;
      const unit = key === "overdueJob" ? " hrs" : " days";
      const lbl = $("#v-" + key);
      if (lbl) lbl.textContent = el.value + unit;
    },
    "threshold-commit"(el) {
      toast("Threshold saved", "Attention queue re-evaluated.", "info");
    },
    toggle(el) {
      const key = el.dataset.key;
      state.settings[key] = !state.settings[key];
      el.classList.toggle("on", state.settings[key]);
      el.setAttribute("aria-checked", String(state.settings[key]));
      toast(state.settings[key] ? "Turned on" : "Turned off", el.getAttribute("aria-label"), "info");
    },
    "set-accent"(el) {
      state.settings.accent = el.dataset.color;
      render();
      toast("Accent updated", "Every screen re-themed instantly.", "info");
    },
    vocab(el) { state.settings[el.dataset.key] = el.value; },
    "save-branding"() {
      toast("Branding saved", '"' + state.settings.vocabJob + '" / "' + state.settings.vocabIntake + '" · ' + state.settings.currency);
    },
    "reset-demo"() {
      openModal("Reset demo data?",
        "<p style='margin-top:0;font-size:13px;'>This restores every invoice, message, and contact to the original seeded state. Anything you logged in this session is discarded.</p>",
        '<button class="btn btn-ghost" data-action="close-modal">Cancel</button>' +
        '<button class="btn btn-danger" data-action="confirm-reset">Reset everything</button>');
    },
    "confirm-reset"() { closeModal(); location.reload(); },
    "wipe-tenant"() {
      openModal("Delete this deployment?",
        "<p style='margin-top:0;font-size:13px;'>This would tear down <strong>" + esc(state.tenant) + "</strong> — its database, its domain, and every record in it. In the real product this requires typing the business name to confirm.</p>" +
        "<div class='field'><label for='wipe-confirm'>Type the business name</label><input type='text' id='wipe-confirm' placeholder='" + esc(state.tenant) + "'></div>",
        '<button class="btn btn-ghost" data-action="close-modal">Cancel</button>' +
        '<button class="btn btn-danger" data-action="confirm-wipe">Delete permanently</button>');
    },
    "confirm-wipe"() {
      const v = $("#wipe-confirm") ? $("#wipe-confirm").value.trim() : "";
      if (v !== state.tenant) { toast("Name doesn't match", "Type the business name exactly to confirm.", "err"); return; }
      closeModal();
      toast("Deletion blocked", "This is a demo — nothing was deleted.", "info");
    },

    // ---- tenant ----
    "switch-tenant"() {
      openModal("Switch deployment",
        "<p style='margin-top:0;font-size:13px;color:var(--ink-secondary);'>Same engine, different client. Watch the vocabulary and accent change.</p>" +
        "<div style='display:grid;gap:8px;'>" + TENANTS.map(t =>
          "<button class='btn btn-ghost' style='justify-content:flex-start;gap:11px;' data-action='pick-tenant' data-key='" + t.key + "'>" +
          "<span style='width:11px;height:11px;border-radius:3px;background:" + t.accent + "'></span>" + esc(t.name) +
          (t.key === state.tenantKey ? "<span style='margin-left:auto;font-size:11px;color:var(--ink-muted);'>current</span>" : "") + "</button>").join("") + "</div>",
        '<button class="btn btn-ghost" data-action="close-modal">Cancel</button>');
    },
    "pick-tenant"(el) {
      const t = TENANTS.find(x => x.key === el.dataset.key);
      if (!t) return;
      state.tenant = t.name; state.tenantKey = t.key;
      state.settings.accent = t.accent;
      state.settings.vocabJob = t.vocabJob;
      state.settings.vocabIntake = t.vocabIntake;
      closeModal(); render();
      toast("Now viewing " + t.name, '"' + t.vocabJob + '" / "' + t.vocabIntake + '" · re-themed.', "info");
    },

    // --- implementation intentions: when-then commitment ---
    // Meta-analysis of 642 tests: specifying WHEN and WHERE an action happens
    // lifts follow-through markedly over intention alone (d = 0.27-0.66).
    "schedule-item"(el) {
      const kind = el.dataset.kind, id = +el.dataset.id;
      const inv = state.invoices.find(x => x.id === id);
      const what = kind === "goto-inbox-missed"
        ? "return the missed calls"
        : (inv ? (kind === "remind-invoice" ? "chase invoice #" + inv.num : "follow up estimate #" + inv.num) + " with " + inv.who : "handle this");
      const triggers = [
        ["Tomorrow, first thing", "when I next open Switchboard"],
        ["Monday morning", "when the week starts"],
        ["After my next job closes", "when I finish the car I am on"],
        ["End of today", "before I lock up"]
      ];
      openModal("When will you " + esc(what) + "?",
        "<p style='margin-top:0;font-size:13px;color:var(--ink-secondary);'>Pick the moment, not just the task. Deciding the trigger in advance is what makes it actually happen.</p>" +
        triggers.map((t, i) =>
          '<button class="trigger-opt' + (i === 0 ? " sel" : "") + '" data-action="pick-trigger" data-when="' + esc(t[0]) + '">' +
            '<span class="to-when">' + esc(t[0]) + '</span><span class="to-then">\u2014 ' + esc(t[1]) + "</span></button>").join("") +
        '<input type="hidden" id="sch-when" value="' + esc(triggers[0][0]) + '">' +
        '<input type="hidden" id="sch-what" value="' + esc(what) + '">' +
        '<input type="hidden" id="sch-kind" value="' + esc(kind) + '">' +
        '<input type="hidden" id="sch-id" value="' + id + '">',
        '<button class="btn btn-ghost" data-action="close-modal">Cancel</button>' +
        '<button class="btn btn-primary" data-action="confirm-schedule">Commit to it</button>');
    },
    "pick-trigger"(el) {
      document.querySelectorAll(".trigger-opt").forEach(b => b.classList.remove("sel"));
      el.classList.add("sel");
      const f = $("#sch-when"); if (f) f.value = el.dataset.when;
    },
    "confirm-schedule"() {
      const when = $("#sch-when") ? $("#sch-when").value : "Tomorrow";
      const what = $("#sch-what") ? $("#sch-what").value : "this";
      const kind = $("#sch-kind") ? $("#sch-kind").value : "";
      const id = $("#sch-id") ? +$("#sch-id").value : 0;
      state.scheduled.push({
        id: nid(), trigger: when, label: "I will " + what,
        detail: "Committed " + new Date().toLocaleDateString("en-US", { month: "short", day: "numeric" }) + " \u00b7 " + kind.replace(/-/g, " "),
        kind: kind, targetId: id
      });
      closeModal(); render();
      toast("Committed", when + " \u2014 " + what + ".");
    },
    "do-scheduled"(el) {
      const s = state.scheduled.find(x => x.id === +el.dataset.id);
      if (!s) return;
      state.scheduled = state.scheduled.filter(x => x.id !== s.id);
      const fake = { dataset: { id: String(s.targetId) } };
      if (actions[s.kind]) { actions[s.kind](fake); }
      else { render(); toast("Done", s.label); }
    },
    "drop-scheduled"(el) {
      const s = state.scheduled.find(x => x.id === +el.dataset.id);
      state.scheduled = state.scheduled.filter(x => x.id !== +el.dataset.id);
      render();
      toast("Dropped", s ? s.label : "", "info");
    },

    // --- command palette ---
    "open-cmdk"() { openCmdk(); },
    "cmdk-bg"(el, e) { if (e.target === el) closeCmdk(); },
    "cmdk-run"(el) { runCmd(+el.dataset.idx); },
    "show-shortcuts"() {
      openModal("Keyboard shortcuts",
        "<div style='display:grid;gap:9px;font-size:13px;'>" +
        [["\u2318 K / Ctrl K", "Command palette \u2014 jump anywhere, run anything"],
         ["G then O / I / P / C / S", "Go to Overview, Inbox, Payments, Contacts, Settings"],
         ["N", "Log activity"],
         ["/", "Focus search"],
         ["?", "This list"],
         ["Esc", "Close anything open"]].map(r =>
          "<div style='display:flex;justify-content:space-between;gap:14px;align-items:center;'>" +
          "<span class='kbd'>" + r[0] + "</span><span style='color:var(--ink-secondary);text-align:right;'>" + r[1] + "</span></div>").join("") +
        "</div>",
        '<button class="btn btn-primary" data-action="close-modal">Got it</button>');
    },

    "close-modal"() { closeModal(); },
    "close-modal-bg"(el, e) { if (e.target === el) closeModal(); }
  };

  // ============ events ============
  document.addEventListener("click", function (e) {
    const el = e.target.closest("[data-action]");
    if (!el) return;
    const fn = actions[el.dataset.action];
    if (fn) { e.preventDefault(); fn(el, e); }
  });

  document.addEventListener("input", function (e) {
    const el = e.target.closest("[data-action]");
    if (el && el.dataset.action === "threshold") actions.threshold(el);
    if (el && el.dataset.action === "vocab") actions.vocab(el);
    if (e.target.id === "search") doSearch(e.target.value);
  });

  document.addEventListener("change", function (e) {
    const el = e.target.closest("[data-action]");
    if (el && el.dataset.action === "threshold") actions["threshold-commit"](el);
    if (el && el.dataset.action === "vocab") actions.vocab(el);
  });

  let goPending = false, goTimer = null;
  const GO_MAP = { o: "overview", i: "inbox", p: "payments", c: "contacts", s: "settings" };

  document.addEventListener("keydown", function (e) {
    const k = e.key;

    // palette open: its own key handling
    if (state.cmdk.open) {
      if (k === "Escape") { e.preventDefault(); closeCmdk(); return; }
      const list = filterCommands(state.cmdk.q);
      if (k === "ArrowDown") { e.preventDefault(); state.cmdk.idx = Math.min(state.cmdk.idx + 1, list.length - 1); renderCmdk(); return; }
      if (k === "ArrowUp") { e.preventDefault(); state.cmdk.idx = Math.max(state.cmdk.idx - 1, 0); renderCmdk(); return; }
      if (k === "Enter") { e.preventDefault(); runCmd(state.cmdk.idx); return; }
      return;
    }

    // Cmd/Ctrl+K works from anywhere, typing included
    if ((e.metaKey || e.ctrlKey) && (k === "k" || k === "K")) { e.preventDefault(); openCmdk(); return; }

    if (k === "Escape") { closeModal(); hideSearch(); goPending = false; return; }

    // don't hijack keys while the user is typing
    const t = e.target;
    const typing = t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT" || t.isContentEditable);
    if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
    if ($("#modalRoot").innerHTML) return;

    if (goPending && GO_MAP[k.toLowerCase()]) {
      e.preventDefault(); goPending = false; clearTimeout(goTimer);
      state.page = GO_MAP[k.toLowerCase()]; render();
      return;
    }
    goPending = false;

    if (k === "g" || k === "G") {
      goPending = true;
      clearTimeout(goTimer);
      goTimer = setTimeout(() => { goPending = false; }, 1200);
      return;
    }
    if (k === "n" || k === "N") { e.preventDefault(); actions["open-capture"](); return; }
    if (k === "/") { e.preventDefault(); const s = $("#search"); if (s) s.focus(); return; }
    if (k === "?") { e.preventDefault(); actions["show-shortcuts"](); return; }
  });

  document.addEventListener("input", function (e) {
    if (e.target && e.target.id === "cmdkInput") {
      state.cmdk.q = e.target.value; state.cmdk.idx = 0; renderCmdk();
    }
  });

  // --- command palette ---------------------------------------------------
  // Adoption research on field-service tools is blunt: "extra taps to close a
  // job, repeated data entry" is the top reason owners quietly revert to
  // spreadsheets. Every action here is two keystrokes from anywhere.
  function buildCommands() {
    const c = [];
    PAGES.forEach(p => c.push({ sec: "Go to", ico: p.ico, label: p.label, hint: "G " + p.key[0].toUpperCase(), run: () => { state.page = p.key; render(); } }));
    c.push({ sec: "Actions", ico: "&#10133;", label: "Log activity", hint: "N", run: () => actions["open-capture"]() });
    c.push({ sec: "Actions", ico: "&#129534;", label: "New invoice", hint: "", run: () => { state.page = "payments"; render(); actions["new-invoice"](); } });
    c.push({ sec: "Actions", ico: "&#128100;", label: "Add contact", hint: "", run: () => { state.page = "contacts"; render(); actions["new-contact"](); } });
    c.push({ sec: "Actions", ico: "&#128233;", label: "Remind all overdue", hint: "", run: () => { state.page = "payments"; render(); actions["remind-all"](); } });
    c.push({ sec: "Actions", ico: "&#9989;", label: "Mark inbox all read", hint: "", run: () => actions["mark-all-read"]() });
    c.push({ sec: "Actions", ico: "&#128190;", label: "Export statement (CSV)", hint: "", run: () => actions["export-csv"]() });
    c.push({ sec: "Actions", ico: "&#8646;", label: "Switch deployment", hint: "", run: () => actions["switch-tenant"]() });
    c.push({ sec: "Actions", ico: "&#9000;", label: "Keyboard shortcuts", hint: "?", run: () => actions["show-shortcuts"]() });
    state.contacts.slice(0, 40).forEach(ct => c.push({
      sec: "Contacts", ico: "&#128100;", label: ct.name, hint: ct.vehicle,
      run: () => { state.page = "contacts"; render(); actions["view-contact"]({ dataset: { id: String(ct.id) } }); }
    }));
    state.invoices.forEach(iv => c.push({
      sec: "Invoices", ico: "&#129534;", label: "#" + iv.num + " \u2014 " + iv.who, hint: money(iv.amount) + " \u00b7 " + iv.status,
      run: () => { state.page = "payments"; state.invoiceFilter = "all"; render(); }
    }));
    return c;
  }

  function filterCommands(q) {
    const all = buildCommands();
    q = (q || "").trim().toLowerCase();
    if (!q) return all.filter(x => x.sec !== "Contacts" && x.sec !== "Invoices");
    return all.filter(x => (x.label + " " + x.sec + " " + (x.hint || "")).toLowerCase().includes(q)).slice(0, 24);
  }

  function openCmdk() {
    state.cmdk.open = true; state.cmdk.q = ""; state.cmdk.idx = 0;
    renderCmdk();
    const i = $("#cmdkInput"); if (i) i.focus();
  }
  function closeCmdk() {
    state.cmdk.open = false;
    const r = $("#cmdkRoot"); if (r) r.innerHTML = "";
  }
  function renderCmdk() {
    const list = filterCommands(state.cmdk.q);
    if (state.cmdk.idx >= list.length) state.cmdk.idx = Math.max(0, list.length - 1);
    let out = "", lastSec = "";
    list.forEach((cmd, i) => {
      if (cmd.sec !== lastSec) { out += '<div class="cmdk-sec">' + cmd.sec + "</div>"; lastSec = cmd.sec; }
      out += '<div class="cmdk-item' + (i === state.cmdk.idx ? " on" : "") + '" data-action="cmdk-run" data-idx="' + i + '">' +
        '<span class="ci-ico">' + cmd.ico + '</span><span class="ci-label">' + esc(cmd.label) + "</span>" +
        (cmd.hint ? '<span class="ci-hint">' + esc(cmd.hint) + "</span>" : "") + "</div>";
    });
    $("#cmdkRoot").innerHTML =
      '<div class="cmdk-overlay" data-action="cmdk-bg"><div class="cmdk" role="dialog" aria-modal="true" aria-label="Command palette">' +
        '<input class="cmdk-input" id="cmdkInput" placeholder="Type a command, contact, or invoice\u2026" autocomplete="off" value="' + esc(state.cmdk.q) + '">' +
        '<div class="cmdk-list">' + (list.length ? out : '<div class="cmdk-empty">Nothing matches that.</div>') + "</div>" +
        '<div class="cmdk-foot"><span><span class="kbd">\u2191\u2193</span> navigate</span><span><span class="kbd">\u21B5</span> run</span><span><span class="kbd">esc</span> close</span></div>' +
      "</div></div>";
    const inp = $("#cmdkInput");
    if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
  }
  function runCmd(i) {
    const list = filterCommands(state.cmdk.q);
    const cmd = list[i];
    closeCmdk();
    if (cmd) cmd.run();
  }

  function hideSearch() {
    const r = $("#searchResults");
    if (r) r.classList.add("hidden");
  }

  function doSearch(q) {
    const box = $("#searchResults");
    q = q.trim().toLowerCase();
    if (!q) { box.classList.add("hidden"); box.innerHTML = ""; return; }
    const hits = [];
    state.contacts.forEach(c => {
      if (c.name.toLowerCase().includes(q) || c.phone.includes(q) || c.vehicle.toLowerCase().includes(q))
        hits.push({ label: c.name, kind: "Contact · " + c.vehicle, action: "view-contact", id: c.id });
    });
    state.invoices.forEach(i => {
      if (i.num.includes(q) || i.who.toLowerCase().includes(q) || i.desc.toLowerCase().includes(q))
        hits.push({ label: "#" + i.num + " — " + i.who, kind: "Invoice · " + money(i.amount), action: "goto-payments", id: i.id });
    });
    state.messages.forEach(m => {
      if (m.who.toLowerCase().includes(q) || m.snippet.toLowerCase().includes(q))
        hits.push({ label: m.who, kind: CHAN_LBL[m.chan] + " · " + m.when, action: "goto-inbox", id: m.id });
    });
    box.classList.remove("hidden");
    box.innerHTML = hits.length
      ? hits.slice(0, 8).map(h => '<div class="sr" data-action="' + h.action + '" data-id="' + h.id + '"><span>' + esc(h.label) + '</span><span class="kind">' + esc(h.kind) + "</span></div>").join("")
      : '<div class="empty">No matches for “' + esc(q) + '”</div>';
  }

  document.addEventListener("click", function (e) {
    if (!e.target.closest(".search-wrap")) hideSearch();
  });

  state.dayStartLoad = attentionItems().length;
  render();
  window.__sb = {
    state: state, actions: actions,
    clearProgress: clearProgress, landmark: landmark,
    openCmdk: openCmdk, closeCmdk: closeCmdk, filterCommands: filterCommands
  };
})();
</script>
