    },

    "close-modal"() { closeModal(); },
    "close-modal-bg"(el, e) { if (e.target === el) closeModal(); },
    "retry-load"() { loadAll(); },
  };

  // ============ events ============
  document.addEventListener("click", function (e) {
    const el = e.target.closest("[data-action]");
    if (!el) return;
    const fn = actions[el.dataset.action];
    if (fn) { e.preventDefault(); fn(el, e); }
  });

  document.addEventListener("input", function (e) {
    const el = e.target.closest("[data-action]");
    if (el && el.dataset.action === "threshold") actions.threshold(el);
    if (el && el.dataset.action === "vocab") actions.vocab(el);
    if (e.target.id === "search") doSearch(e.target.value);
  });

  document.addEventListener("change", function (e) {
    const el = e.target.closest("[data-action]");
    if (el && el.dataset.action === "threshold") actions["threshold-commit"](el);
    if (el && el.dataset.action === "vocab") actions.vocab(el);
  });

  let goPending = false, goTimer = null;
  const GO_MAP = { o: "overview", i: "inbox", p: "payments", c: "contacts", s: "settings" };

  document.addEventListener("keydown", function (e) {
    const k = e.key;

    if (state.cmdk.open) {
      if (k === "Escape") { e.preventDefault(); closeCmdk(); return; }
      const list = filterCommands(state.cmdk.q);
      if (k === "ArrowDown") { e.preventDefault(); state.cmdk.idx = Math.min(state.cmdk.idx + 1, list.length - 1); renderCmdk(); return; }
      if (k === "ArrowUp") { e.preventDefault(); state.cmdk.idx = Math.max(state.cmdk.idx - 1, 0); renderCmdk(); return; }
      if (k === "Enter") { e.preventDefault(); runCmd(state.cmdk.idx); return; }
      return;
    }

    if ((e.metaKey || e.ctrlKey) && (k === "k" || k === "K")) { e.preventDefault(); openCmdk(); return; }

    if (k === "Escape") { closeModal(); hideSearch(); goPending = false; return; }

    const t = e.target;
    const typing = t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT" || t.isContentEditable);
    if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
    if ($("#modalRoot").innerHTML) return;

    if (goPending && GO_MAP[k.toLowerCase()]) {
      e.preventDefault(); goPending = false; clearTimeout(goTimer);
      state.page = GO_MAP[k.toLowerCase()]; render();
      return;
    }
    goPending = false;

    if (k === "g" || k === "G") {
      goPending = true;
      clearTimeout(goTimer);
      goTimer = setTimeout(() => { goPending = false; }, 1200);
      return;
    }
    if (k === "n" || k === "N") { e.preventDefault(); actions["open-capture"](); return; }
    if (k === "/") { e.preventDefault(); const s = $("#search"); if (s) s.focus(); return; }
    if (k === "?") { e.preventDefault(); actions["show-shortcuts"](); return; }
  });

  document.addEventListener("input", function (e) {
    if (e.target && e.target.id === "cmdkInput") {
      state.cmdk.q = e.target.value; state.cmdk.idx = 0; renderCmdk();
    }
  });

  // --- command palette ---
  function buildCommands() {
    const c = [];
    PAGES.forEach(p => c.push({ id: "go:" + p.key, sec: "Go to", ico: p.ico, label: p.label, hint: "G " + p.key[0].toUpperCase(), run: () => { state.page = p.key; render(); } }));
    c.push({ id: "act:capture", sec: "Actions", ico: "&#10133;", label: "Log activity", hint: "N", run: () => actions["open-capture"]() });
    c.push({ id: "act:new-invoice", sec: "Actions", ico: "&#129534;", label: "New invoice", hint: "", run: () => { state.page = "payments"; render(); actions["new-invoice"](); } });
    c.push({ id: "act:new-contact", sec: "Actions", ico: "&#128100;", label: "Add contact", hint: "", run: () => { state.page = "contacts"; render(); actions["new-contact"](); } });
    c.push({ id: "act:remind-all", sec: "Actions", ico: "&#128233;", label: "Remind all overdue", hint: "", run: () => { state.page = "payments"; render(); actions["remind-all"](); } });
    c.push({ id: "act:mark-all-read", sec: "Actions", ico: "&#9989;", label: "Mark inbox all read", hint: "", run: () => actions["mark-all-read"]() });
    c.push({ id: "act:export-csv", sec: "Actions", ico: "&#128190;", label: "Export statement (CSV)", hint: "", run: () => actions["export-csv"]() });
    c.push({ id: "act:switch-tenant", sec: "Actions", ico: "&#8646;", label: "Switch deployment", hint: "", run: () => actions["switch-tenant"]() });
    c.push({ id: "act:shortcuts", sec: "Actions", ico: "&#9000;", label: "Keyboard shortcuts", hint: "?", run: () => actions["show-shortcuts"]() });
    state.contacts.slice(0, 40).forEach(ct => c.push({
      id: "contact:" + ct.id, sec: "Contacts", ico: "&#128100;", label: ct.name, hint: ct.notes || "",
      run: () => { state.page = "contacts"; render(); actions["view-contact"]({ dataset: { id: String(ct.id) } }); }
    }));
    invoiceViews().forEach(iv => c.push({
      id: "invoice:" + iv.id, sec: "Invoices", ico: "&#129534;", label: iv.num + " — " + iv.who, hint: money(iv.amount_cents) + " · " + iv.status,
      run: () => { state.page = "payments"; state.invoiceFilter = "all"; render(); }
    }));
    return c;
  }

  // Recognition over recall: tools like Linear and Raycast surface your
  // recently-run commands first when the palette opens with no query, since
  // people re-run the same handful of things far more than they explore —
  // finding "the thing I did an hour ago" by scanning beats retyping it.
  const RECENTS_KEY = "opsdesk_switchboard_recent_cmds";
  function loadRecentCmdIds() {
    try { return JSON.parse(localStorage.getItem(RECENTS_KEY) || "[]"); }
    catch { return []; }
  }
  function recordRecentCmd(id) {
    try {
      const ids = loadRecentCmdIds().filter(x => x !== id);
      ids.unshift(id);
      localStorage.setItem(RECENTS_KEY, JSON.stringify(ids.slice(0, 5)));
    } catch { /* private browsing or storage disabled — recents just won't persist */ }
  }

  function filterCommands(q) {
    const all = buildCommands();
    q = (q || "").trim().toLowerCase();
    if (!q) {
      const byId = new Map(all.map(c => [c.id, c]));
      const recentIds = loadRecentCmdIds().filter(id => byId.has(id));
      const recents = recentIds.map(id => Object.assign({}, byId.get(id), { sec: "Recent" }));
      const rest = all.filter(x => x.sec !== "Contacts" && x.sec !== "Invoices" && !recentIds.includes(x.id));
      return recents.concat(rest);
    }
    return all.filter(x => (x.label + " " + x.sec + " " + (x.hint || "")).toLowerCase().includes(q)).slice(0, 24);
  }

  function openCmdk() {
    state.cmdk.open = true; state.cmdk.q = ""; state.cmdk.idx = 0;
    renderCmdk();
    const i = $("#cmdkInput"); if (i) i.focus();
  }
  function closeCmdk() {
    state.cmdk.open = false;
    const r = $("#cmdkRoot"); if (r) r.innerHTML = "";
  }
  function renderCmdk() {
    const list = filterCommands(state.cmdk.q);
    if (state.cmdk.idx >= list.length) state.cmdk.idx = Math.max(0, list.length - 1);
    let out = "", lastSec = "";
    list.forEach((cmd, i) => {
      if (cmd.sec !== lastSec) { out += '<div class="cmdk-sec">' + cmd.sec + "</div>"; lastSec = cmd.sec; }
      out += '<div class="cmdk-item' + (i === state.cmdk.idx ? " on" : "") + '" data-action="cmdk-run" data-idx="' + i + '">' +
        '<span class="ci-ico">' + cmd.ico + '</span><span class="ci-label">' + esc(cmd.label) + "</span>" +
        (cmd.hint ? '<span class="ci-hint">' + esc(cmd.hint) + "</span>" : "") + "</div>";
    });
    $("#cmdkRoot").innerHTML =
      '<div class="cmdk-overlay" data-action="cmdk-bg"><div class="cmdk" role="dialog" aria-modal="true" aria-label="Command palette">' +
        '<input class="cmdk-input" id="cmdkInput" placeholder="Type a command, contact, or invoice…" autocomplete="off" value="' + esc(state.cmdk.q) + '">' +
        '<div class="cmdk-list">' + (list.length ? out : '<div class="cmdk-empty">Nothing matches that.</div>') + "</div>" +
        '<div class="cmdk-foot"><span><span class="kbd">↑↓</span> navigate</span><span><span class="kbd">↵</span> run</span><span><span class="kbd">esc</span> close</span></div>' +
      "</div></div>";
    const inp = $("#cmdkInput");
    if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
  }
  function runCmd(i) {
    const list = filterCommands(state.cmdk.q);
    const cmd = list[i];
    closeCmdk();
    if (cmd) { recordRecentCmd(cmd.id); cmd.run(); }
  }

  function hideSearch() {
    const r = $("#searchResults");
    if (r) r.classList.add("hidden");
  }

  // Matches the command palette's own interaction model (arrow keys, Enter,
  // a highlighted row) rather than making the user learn a second pattern
  // for what is, from their side, the same "find something" gesture —
  // consistency between similar controls in one product (Jakob's Law).
  let searchTimer = null;
  let searchIdx = -1;
  let lastSearchHits = [];
  let lastSearchQuery = "";

  function highlightMatch(text, q) {
    if (!q) return esc(text);
    const idx = text.toLowerCase().indexOf(q.toLowerCase());
    if (idx === -1) return esc(text);
    return esc(text.slice(0, idx)) + '<mark class="sr-hit">' + esc(text.slice(idx, idx + q.length)) + "</mark>" + esc(text.slice(idx + q.length));
  }

  function renderSearchResults() {
    const box = $("#searchResults");
    if (!box) return;
    box.classList.remove("hidden");
    if (searchIdx >= lastSearchHits.length) searchIdx = lastSearchHits.length - 1;
    box.innerHTML = lastSearchHits.length
      ? lastSearchHits.map((h, i) => '<div class="sr' + (i === searchIdx ? " on" : "") + '" data-action="' + h.action + '" data-id="' + h.id + '"><span>' + highlightMatch(h.label, lastSearchQuery) + '</span><span class="kind">' + esc(h.kind) + "</span></div>").join("")
      : '<div class="empty">No matches for “' + esc(lastSearchQuery) + '”</div>';
  }

  function doSearch(q) {
    const box = $("#searchResults");
    q = q.trim();
    lastSearchQuery = q;
    searchIdx = -1;
    if (!q) { box.classList.add("hidden"); box.innerHTML = ""; lastSearchHits = []; return; }
    clearTimeout(searchTimer);
    searchTimer = setTimeout(async () => {
      let res;
      try { res = await api("GET", "/api/search?q=" + encodeURIComponent(q)); }
      catch (e) { return; }
      const hits = [];
      (res.contacts || []).forEach(c => hits.push({ label: c.name, kind: "Contact · " + (c.phone || ""), action: "view-contact", id: c.id }));
      (res.invoices || []).forEach(i => hits.push({ label: i.number + " — " + ((i.contact && i.contact.name) || "Walk-in"), kind: "Invoice · " + money(i.totals ? i.totals.total : 0), action: "goto-payments", id: i.id }));
      (res.messages || []).forEach(m => hits.push({ label: msgWho(m), kind: (CHAN_LBL[m.channel] || m.channel) + " · " + timeAgo(m.occurred_at), action: "goto-inbox", id: m.id }));
      lastSearchHits = hits.slice(0, 8);
      renderSearchResults();
    }, 180);
  }

  document.addEventListener("keydown", function (e) {
    if (!(e.target && e.target.id === "search")) return;
    const box = $("#searchResults");
    if (!box || box.classList.contains("hidden") || !lastSearchHits.length) return;
    if (e.key === "ArrowDown") {
      e.preventDefault();
      searchIdx = searchIdx < 0 ? 0 : Math.min(searchIdx + 1, lastSearchHits.length - 1);
      renderSearchResults();
    } else if (e.key === "ArrowUp") {
      e.preventDefault();
      searchIdx = Math.max(searchIdx - 1, 0);
      renderSearchResults();
    } else if (e.key === "Enter") {
      e.preventDefault();
      const h = lastSearchHits[searchIdx >= 0 ? searchIdx : 0];
      if (h) {
        hideSearch();
        const fn = actions[h.action];
        if (fn) fn({ dataset: { id: String(h.id) } });
      }
    }
  });

  document.addEventListener("click", function (e) {
    if (!e.target.closest(".search-wrap")) hideSearch();
  });

  loadAll();
  window.__sb = {
    state: state, actions: actions,
    clearProgress: clearProgress, landmark: landmark,
    openCmdk: openCmdk, closeCmdk: closeCmdk, filterCommands: filterCommands
  };
})();
</script>
